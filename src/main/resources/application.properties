spring.application.name=policy_management_system

# --- Database: PostgreSQL (Docker container policy-postgres) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/policydb
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Hibernate creates/updates tables from the entities ---
spring.jpa.hibernate.ddl-auto=update

# --- Print the SQL Hibernate runs ---
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- No lazy loading outside a transaction; the service layer must return fully loaded data ---
spring.jpa.open-in-view=false