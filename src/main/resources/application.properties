spring.application.name=policy_management_system

# --- Database: file-based H2, so data survives a restart ---
spring.datasource.url=jdbc:h2:file:./data/policydb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- Hibernate creates/updates tables from the entities ---
spring.jpa.hibernate.ddl-auto=update

# --- Print the SQL Hibernate runs ---
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- No lazy loading outside a transaction; the service layer must return fully loaded data ---
spring.jpa.open-in-view=false

# --- H2 console at /h2-console ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console