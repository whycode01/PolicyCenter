# ------------------------------------------------------------------
# Test configuration
# No datasource URL is set on purpose: Spring Boot creates a separate,
# uniquely named in-memory H2 database for each test context.
# Tests never touch ./data/policydb, and one test context can't close
# a database another test is still using.
# ------------------------------------------------------------------

spring.datasource.username=sa
spring.datasource.password=

# Fresh schema built from the entities for every test context, dropped afterwards
spring.jpa.hibernate.ddl-auto=create-drop

# Print the SQL Hibernate runs, so you can see the SELECT after flush()/clear()
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Same setting as the main app: database access only inside service/repository code
spring.jpa.open-in-view=false

# The H2 console isn't needed during tests
spring.h2.console.enabled=false